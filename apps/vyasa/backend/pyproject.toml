[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vyasa-core-backend"
version = "0.1.0"
description = "VYASA Core Ecosystem Platform & Identity Backend Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VYASA Core Team" }
]
keywords = ["vyasa", "governance", "fastapi", "sqlalchemy", "csjmu"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
